<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlockpotDAO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="root"></div>

  <!-- DebugHub SDK -->
  <!-- supabaseUrl/supabaseKey enable the network sink so this app's
       telemetry reaches the shared hub, not just localStorage. The key
       is a publishable client key — RLS is the security boundary. -->
  <script>window.DEBUGHUB_CONFIG = {
    appName:     "BlockpotDAO",
    supabaseUrl: "https://ipyfodnidwsdvwqrcjrl.supabase.co",
    supabaseKey: "sb_publishable_yg4wjMwvGrlf5C9vqs2nkw_Hfks0Ux9"
  };</script>
  <script src="https://0xtimberzx.github.io/MyDapp/debughub/sdk/debugger.js?v=1.2.1"></script>
  <script>
    if (!window.DebugHub) {
      window.DebugHub = {
        startSession: function () {},
        endSession: function () {},
        logCheckpoint: function () {},
        logError: function () {},
        logPerf: function () {},
        logSecurity: function () {}
      };
      console.warn("⚠ DebugHub SDK did not load — running without telemetry.");
    }
  </script>

  <!-- Load libraries first, in order -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel MUST load before app.js is parsed -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- app.js loaded AFTER Babel with text/babel type -->
  <!-- data-plugins ensures async Babel transform works -->
  <script type="text/babel" data-presets="react" src="app.js"></script>
</body>
</html>
